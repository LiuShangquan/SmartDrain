name: verify
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: make generate manifests
      - run: git diff --exit-code -- api config/crd config/rbac
      - run: test -z "$(gofmt -l api cmd internal test)"
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/...
      - run: go test -count=1 ./...
      - run: go build -o bin/manager ./cmd
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: bash hack/deploy-dev.sh --create-cluster
      - name: Real API and lifecycle tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.smartdrain.kubeconfig
          SMARTDRAIN_API_TESTS: '1'
          SMARTDRAIN_E2E: '1'
          SMARTDRAIN_FAULT_TESTS: '1'
        run: |
          go test -v -count=1 ./test/integration
          go test -v -count=1 -timeout=20m ./test/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-evidence
          path: artifacts/runs
