apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../default
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: smartdrain-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [--leader-elect=true, --allow-direct-delete=true]
