apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdrain-controller-manager
  namespace: smartdrain-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smartdrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartdrain
    spec:
      serviceAccountName: smartdrain-controller-manager
      nodeSelector:
        smartdrain.dev/role: operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: smartdrain:dev
          imagePullPolicy: IfNotPresent
          args: [--leader-elect=true]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
